spring.application.name=USER-SERVICE

spring.config.import=configserver:http://localhost:8885
server.port : 8881
spring.datasource.url=jdbc:postgresql://localhost:5432/hotelmicroservice
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


## Enable registration to Eureka server
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#
## Instance configuration
#eureka.instance.hostname=localhost
#eureka.instance.prefer-ip-address=true
#
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# circuit breaker configurations
#actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.metrics.circuitbreakers.enabled=true

#Resillence 4j

# Resilience4j Circuit Breaker Configuration for ratingHotelBreaker

resilience4j.circuitbreaker.instances.ratingHotelBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ratingHotelBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.ratingHotelBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.waitDurationInOpenState=6s
resilience4j.circuitbreaker.instances.ratingHotelBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowType=COUNT_BASED


# Resilience4j Retry Configuration for ratingHotelService

resilience4j.retry.instances.ratingHotelService.max-attempts=3
resilience4j.retry.instances.ratingHotelService.wait-duration=5s



# Resilience4j RateLimiter Configuration for userRateLimiter

resilience4j.ratelimiter.instances.userRateLimiter.limit-refresh-period=4s
resilience4j.ratelimiter.instances.userRateLimiter.limit-for-period=2
resilience4j.ratelimiter.instances.userRateLimiter.timeout-duration=2s




